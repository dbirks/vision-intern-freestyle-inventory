base_url: https://llm-collective.e-gineering.com/v1
api_key_env: LLMC_API_KEY
primary_labeller: david-birks/inkling-2-mini
fusion_iou: 0.55
# NOTE: qwen3-8-flash-next was dropped as the second labeller for the 2026-11
# smoke run (see runs/bootstrap_v1/summary.md): it is at capacity on the
# collective and one label call took ~530 s with repeated 429s, vs ~7 s for
# inkling. It is kept only for the judge (light crops-mode calls, ~30 s/image).
labellers:
  - name: inkling-full
    model: david-birks/inkling-2-mini
    max_tokens: 8192
  - name: inkling-tiles
    model: david-birks/inkling-2-mini
    tile: 1280
    tile_overlap: 0.2
    max_tokens: 8192
judge:
  model: qwen3-8-flash-next
  batch_size: 8
  max_tokens: 4096
identifier:
  model: david-birks/inkling-2-mini
  batch_size: 8
  upscale: 2
  min_confidence: 0.5
