# C1 detector and DINOv2 identification with shelf geometry and advisory votes.
id: E1_rfdetr_agnostic_shelf
family: E_shelf
compute:
  target: k8s:5090
  vram_mb: 12000
  timeout: 14400
localizer:
  type: tiled_detector
  training:
    model: RFDETRSmall
    resolution: 512
    epochs: 50
    batch_size: 4
identifier:
  type: embedding_knn
  model: facebook/dinov2-base
count:
  neighbour_vote: report
  max_rows: 4
