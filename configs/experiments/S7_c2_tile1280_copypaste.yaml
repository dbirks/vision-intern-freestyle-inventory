# S2_c2_tile1280: C2 with tile 1280 (bigger tiles, fewer of them)
# Follow-up beyond the requested list: S2 (tile) and S3 (augment) were the two positive axes.
# Extra knob block below is exactly S3's. Model bootstrap labels only (NOT GT).
id: S7_c2_tile1280_copypaste
family: C_det_agnostic_plus_embed
compute:
  target: k8s:5090
  vram_mb: 12000
  timeout: 1500
data:
  train: labels/bootstrap_v2.json
  val: labels/bootstrap_v2.json
  test: labels/bootstrap_v2.json
  bootstrap: labels/bootstrap_v2.json
  label_source: bootstrap
  bootstrap_filter:
    verdicts: [correct]
localizer:
  type: tiled_detector
  tile: 1280
  overlap: 0.25
  training:
    model: RFDETRMedium
    resolution: 576
    epochs: 100
    batch_size: 4
    early_stopping: true
    early_stopping_patience: 15
    augment:
      n_per_image: 3
      slot_shuffle_prob: 0.5
      blend_mode: hybrid
      perspective_jitter: 0.03
identifier:
  type: none
embeddings:
  model: google/siglip2-base-patch16-224
  batch_size: 64
count:
  identity_thr: 0.5
