# F1 rfdetr agnostic vlm id comparison.
id: F1_rfdetr_agnostic_vlm_id
family: F_det_plus_vlm_id
compute:
  target: k8s:5090
  vram_mb: 12000
  timeout: 14400
localizer:
  type: tiled_detector
  training:
    model: RFDETRSmall
    resolution: 512
    epochs: 50
    batch_size: 4
identifier:
  type: vlm_crop
  model: inkling
