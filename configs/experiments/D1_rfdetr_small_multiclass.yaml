# D1: RF-DETR Small, classes = catalog id slugs (same tiling/protocol as C1).
# Model bootstrap labels only (no human GT): every metric is vs-model-labels, NOT GT.
# Unknown-identity boxes are KEPT as their own generic 'unknown' class (256 of 563
# bootstrap boxes): dropping them would teach the detector to suppress real cartridges.
id: D1_rfdetr_small_multiclass
family: D_det_multiclass
compute:
  target: k8s:5090
  vram_mb: 12000
  timeout: 3600
data:
  train: labels/bootstrap_v2.json
  val: labels/bootstrap_v2.json
  test: labels/bootstrap_v2.json
  bootstrap: labels/bootstrap_v2.json
  label_source: bootstrap
  bootstrap_filter:
    verdicts: [correct]
localizer:
  type: tiled_detector
  tile: 1024
  overlap: 0.25
  training:
    model: RFDETRSmall
    resolution: 512
    epochs: 100
    batch_size: 8
    early_stopping: true
    early_stopping_patience: 15
identifier:
  type: none
embeddings:
  model: facebook/dinov2-base
  batch_size: 64
