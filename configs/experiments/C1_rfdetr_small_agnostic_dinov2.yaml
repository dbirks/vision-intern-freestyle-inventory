# C1 rfdetr small agnostic dinov2 comparison.
id: C1_rfdetr_small_agnostic_dinov2
family: C_det_agnostic_plus_embed
compute:
  target: k8s:5090
  vram_mb: 12000
  timeout: 14400
localizer:
  type: tiled_detector
  training:
    model: RFDETRSmall
    resolution: 512
    epochs: 50
    batch_size: 4
identifier:
  type: embedding_knn
  model: facebook/dinov2-base
